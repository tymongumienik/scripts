<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Board</title>
    <link rel="preconnect" href="https://fonts.upset.dev">
    <link
        href="https://fonts.upset.dev/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.5;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e6e6e6;
            padding: 1.25rem 0;
            margin-bottom: 2rem;
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.02em;
        }

        header .count {
            font-size: 0.875rem;
            color: #666;
            margin-top: 0.25rem;
            font-weight: 400;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
        }

        .job-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .job-item {
            background: #fff;
            border: 1px solid #e6e6e6;
            border-top: 0;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .job-item:first-child {
            border-top: 1px solid #e6e6e6;
            border-radius: 4px 4px 0 0;
        }

        .job-item:last-child {
            border-radius: 0 0 4px 4px;
        }

        .job-item:only-child {
            border-radius: 4px;
        }

        .job-item:hover {
            background: #f8f8f8;
        }

        .job-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .company-logo {
            height: 48px;
            width: 90px;
            object-fit: contain;
            flex-shrink: 0;
            background: transparent;
        }

        .job-info {
            flex: 1;
            min-width: 0;
        }

        .job-title {
            font-size: 1rem;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 0.125rem;
            line-height: 1.4;
        }

        .company-name {
            color: #666;
            font-size: 0.875rem;
            font-weight: 400;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 0.75rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .meta-separator {
            color: #d4d4d4;
        }

        .salary-info {
            font-weight: 500;
            color: #1a1a1a;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .skill-item {
            background: #f5f5f5;
            color: #4a4a4a;
            padding: 0.25rem 0.625rem;
            border-radius: 3px;
            font-size: 0.8125rem;
            font-weight: 400;
        }

        .job-footer {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #f0f0f0;
            font-size: 0.8125rem;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .darkmode-toggle {
            fill: #222;
            cursor: pointer;
        }

        @media (max-width: 640px) {

            .header-content,
            .container {
                padding: 0 1rem;
            }

            .job-item {
                padding: 1rem;
            }

            .job-meta {
                flex-direction: column;
                gap: 0.375rem;
            }

            .meta-separator {
                display: none;
            }
        }

        body.dark {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark header {
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        body.dark header h1 {
            color: #fff;
        }

        body.dark header .count {
            color: #aaa;
        }

        body.dark .job-item {
            background: #1e1e1e;
            border-color: #333;
            color: #e0e0e0;
        }

        body.dark .job-item:hover {
            background: #2a2a2a;
        }

        body.dark .job-title {
            color: #fff;
        }

        body.dark .company-name,
        body.dark .job-meta,
        body.dark .salary-info {
            color: #aaa;
        }

        body.dark .skill-item {
            background: #2a2a2a;
            color: #ddd;
        }

        body.dark .job-footer {
            border-color: #333;
            color: #777;
        }

        body.dark .empty-state {
            color: #aaa;
        }

        body.dark .darkmode-toggle {
            fill: #e0e0e0;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-content">
            <div>
                <h1>Offers scraped from justjoin.it</h1>
                <p class="count" id="jobCount"></p>
            </div>

            <!-- md MdDarkMode from react-icons -->
            <svg class="darkmode-toggle" stroke="currentColor" stroke-width="0" viewBox="0 0 24 24" height="40px"
                width="40px" xmlns="http://www.w3.org/2000/svg">
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path
                    d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z">
                </path>
            </svg>
        </div>
    </header>

    <div class="container">
        <div id="jobsContainer" class="job-list"></div>
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatSalary(salary) {
            if (!salary) return null;

            const { type, gross, timespan, range } = salary;

            try {
                const formattedRange = `${range.from.toLocaleString('pl-PL')} - ${range.to.toLocaleString('pl-PL')} PLN`;
                const typeLabel = {
                    'b2b': 'B2B',
                    'permanent': 'UoP',
                    'internship': 'Internship',
                    'mandate-contract': 'Mandate',
                    'specific-task-contract': 'Task Contract'
                }[type];
                const grossLabel = gross ? 'gross' : 'net';

                return `${formattedRange} ${grossLabel} (${typeLabel})`;
            } catch {
                return null;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = date - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return 'Expired';
            } else if (diffDays === 0) {
                return 'Today';
            } else if (diffDays === 1) {
                return 'Tomorrow';
            } else if (diffDays < 7) {
                return `${diffDays} days`;
            } else {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }

        function renderJobItem(job) {
            const jobItem = document.createElement('a');
            jobItem.href = job.url;
            jobItem.className = 'job-item';
            jobItem.target = '_blank';

            // Create job top section
            const jobTop = document.createElement('div');
            jobTop.className = 'job-top';

            const logo = document.createElement('img');
            logo.src = job.company.logo;
            logo.alt = job.company.name;
            logo.className = 'company-logo';

            const jobInfo = document.createElement('div');
            jobInfo.className = 'job-info';

            const jobTitle = document.createElement('div');
            jobTitle.className = 'job-title';
            jobTitle.textContent = job.title;

            const companyName = document.createElement('div');
            companyName.className = 'company-name';
            companyName.textContent = job.company.name;

            jobInfo.appendChild(jobTitle);
            jobInfo.appendChild(companyName);
            jobTop.appendChild(logo);
            jobTop.appendChild(jobInfo);

            // Create job meta section
            const jobMeta = document.createElement('div');
            jobMeta.className = 'job-meta';

            const salary = job.metadata.salary ? formatSalary(job.metadata.salary) : null;
            if (salary) {
                const salarySpan = document.createElement('span');
                salarySpan.className = 'salary-info';
                salarySpan.textContent = salary;
                jobMeta.appendChild(salarySpan);

                const separator1 = document.createElement('span');
                separator1.className = 'meta-separator';
                separator1.textContent = '•';
                jobMeta.appendChild(separator1);
            }

            const workplaceSpan = document.createElement('span');
            workplaceSpan.className = 'meta-item';
            workplaceSpan.textContent = {
                'remote': 'Remote',
                'hybrid': 'Hybrid',
                'office': 'Office'
            }[job.metadata.workplace];
            jobMeta.appendChild(workplaceSpan);

            const separator2 = document.createElement('span');
            separator2.className = 'meta-separator';
            separator2.textContent = '•';
            jobMeta.appendChild(separator2);

            const hoursSpan = document.createElement('span');
            hoursSpan.className = 'meta-item';
            hoursSpan.textContent = {
                'full_time': 'Full-time',
                'part_time': 'Part-time',
                'internship': 'Internship',
                'freelance': 'Freelance'
            }[job.metadata.hours];
            jobMeta.appendChild(hoursSpan);

            // Create skills section
            const skillsList = document.createElement('div');
            skillsList.className = 'skills-list';

            job.metadata.skills.forEach(skill => {
                const skillItem = document.createElement('span');
                skillItem.className = 'skill-item';
                skillItem.textContent = skill;
                skillsList.appendChild(skillItem);
            });

            // Create footer
            const jobFooter = document.createElement('div');
            jobFooter.className = 'job-footer';
            const expiresOn = formatDate(job.date.expires);
            jobFooter.textContent = `Expires on ${escapeHtml(expiresOn)}`;

            // Assemble everything
            jobItem.appendChild(jobTop);
            jobItem.appendChild(jobMeta);
            jobItem.appendChild(skillsList);
            jobItem.appendChild(jobFooter);

            return jobItem;
        }

        function renderJobs() {
            const container = document.getElementById('jobsContainer');
            const countElement = document.getElementById('jobCount');

            if (jobOffers.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.textContent = 'No job offers available.';
                container.appendChild(emptyState);
                countElement.textContent = '';
                return;
            }

            countElement.textContent = `${jobOffers.length} position${jobOffers.length !== 1 ? 's' : ''} available`;

            container.innerHTML = '';
            jobOffers.forEach(job => {
                container.appendChild(renderJobItem(job));
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
        }

        renderJobs();

        document.querySelector(".darkmode-toggle").addEventListener("click", toggleDarkMode);
    </script>
</body>

</html>
